# Erzeugt Software-Stücklisten (SBOM) nach CycloneDX mit Trivy – aus den Lockfiles
# (uv.lock, package-lock.json) und aus den in diesem Lauf gebauten Docker-Images.
#
# Die SBOMs liegen bewusst NICHT im Repo:
# - jeder Lauf: als Artefakt am Workflow-Lauf (Download unter Actions, 90 Tage),
# - veröffentlichtes Release: zusätzlich dauerhaft als Anhang am Release.
# Von dort lassen sie sich in CVE-Radar importieren.
name: SBOM

on:
  push:
    branches: [main]
    paths:
      - backend/uv.lock
      - backend/pyproject.toml
      - backend/Dockerfile
      - backend/.dockerignore
      - frontend/package-lock.json
      - frontend/Dockerfile
      - frontend/.dockerignore
      - compose.yaml
      - .github/workflows/sbom.yml
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    # Montags 05:17 UTC – neue Pakete in den Basis-Images fallen so wöchentlich auf.
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: false

env:
  TRIVY_VERSION: v0.76.1
  ARTIFACT_NAME: sbom
  ARTIFACT_RETENTION_DAYS: 90

jobs:
  generate:
    name: SBOMs erzeugen
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Trivy installieren
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Images bauen (nur lokal, kein Push)
        run: |
          docker buildx build --load --tag cve-radar-backend:sbom backend
          docker buildx build --load --tag cve-radar-frontend:sbom frontend

      - name: SBOMs erzeugen
        run: |
          mkdir -p out
          trivy fs --quiet --format cyclonedx --output out/backend-source.cdx.json backend
          trivy fs --quiet --format cyclonedx --output out/frontend-source.cdx.json frontend
          trivy image --quiet --format cyclonedx --output out/backend-image.cdx.json cve-radar-backend:sbom
          trivy image --quiet --format cyclonedx --output out/frontend-image.cdx.json cve-radar-frontend:sbom

      - name: SBOMs als Artefakt ablegen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: out/*.cdx.json
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  release:
    name: SBOMs an das Release hängen
    needs: generate
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # einziges Schreibrecht: Anhänge am Release
    steps:
      - name: SBOMs holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: out

      - name: An das Release anhängen
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" out/*.cdx.json --clobber --repo "$GITHUB_REPOSITORY"
